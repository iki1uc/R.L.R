:root{
  --bg:#0b1020;
  --panel:#141d32;
  --panel2:#10182c;
  --line:#31415f;
  --ink:#edf3ff;
  --muted:#9aa9c8;
  --cyan:#66e0d0;
  --gold:#f4c96b;
  --red:#ff8585;
  --green:#8be0a1;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1020;
    --panel:#141d32;
    --line:#31415f;
    --ink:#edf3ff;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif
}

button,input,select{
  font:inherit
}

button{
  cursor:pointer
}

input[type="text"],input[type="number"]{
  background:#0b1020;
  border:1px solid var(--line);
  color:var(--ink);
  border-radius:8px;
  padding:9px 10px;
  width:100%
}

input[type="range"]{
  width:100%;
  accent-color:var(--cyan)
}

input[type="checkbox"]{
  width:18px;
  height:18px;
  accent-color:var(--cyan)
}

.tab-btn{
  border:1px solid var(--line);
  background:#10182c;
  color:var(--ink);
  border-radius:999px;
  padding:8px 11px;
  font-weight:800;
  font-size:12px;
  letter-spacing:.04em;
  white-space:nowrap
}

.tab-btn[aria-selected="true"]{
  background:var(--cyan);
  color:#06251f;
  border-color:var(--cyan)
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px
}

.kpi{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 14px
}

.kpi b{
  font-size:26px;
  line-height:1
}

.mono{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid var(--line);
  border-radius:999px;
  padding:4px 9px;
  font-size:12px;
  font-weight:800
}

.btn{
  background:var(--cyan);
  color:#06251f;
  border:0;
  border-radius:9px;
  padding:10px 14px;
  font-weight:900
}

.btn-gold{
  background:var(--gold);
  color:#2a1e02
}

.btn-ghost{
  background:transparent;
  color:var(--ink);
  border:1px solid var(--line)
}

.btn-red{
  background:var(--red);
  color:#2a0a0a
}

.seg{
  display:flex;
  background:#0b1020;
  border:1px solid var(--line);
  border-radius:10px;
  padding:4px;
  gap:4px
}

.seg button{
  flex:1;
  border:0;
  background:transparent;
  color:var(--muted);
  padding:8px;
  border-radius:7px;
  font-weight:800
}

.seg button.on{
  background:var(--panel);
  color:var(--ink);
  box-shadow:0 0 0 1px var(--line)
}

.grid9{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px
}

.cell9{
  aspect-ratio:1/1;
  border:1px solid var(--line);
  border-radius:12px;
  background:#0b1020;
  font-weight:900;
  font-size:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:2px
}

.cell9 small{
  font-size:10px;
  color:var(--muted)
}

.truth{
  width:100%;
  border-collapse:collapse;
  font-size:14px
}

.truth th,.truth td{
  border:1px solid var(--line);
  padding:9px 10px;
  text-align:center
}

.truth tr.active{
  background:rgba(102,224,208,.16)
}

.matrix{
  display:grid;
  grid-template-columns:repeat(9,1fr);
  gap:5px
}

.mcell{
  aspect-ratio:1/1;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:900;
  opacity:.82
}

.mcell.pass{
  background:#173a26;
  color:#8be0a1;
  border:1px solid #2f6b48
}

.mcell.fail{
  background:#4a1d24;
  color:#ff8585;
  border:1px solid #7a333d
}

@media (max-width:700px){
  .two{
    grid-template-columns:1fr !important
  }

  .three{
    grid-template-columns:1fr !important
  }

  .kpis{
    grid-template-columns:repeat(2,1fr) !important
  }

  .tab-btn{
    font-size:11px;
    padding:7px 9px
  }

  .matrix{
    grid-template-columns:repeat(9,1fr);
    gap:3px
  }
}
